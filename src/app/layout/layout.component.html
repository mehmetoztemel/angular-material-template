<div class="layout-container">
  <a class="skip-link" href="#main-content">İçeriğe geç</a>
  <mat-toolbar class="toolbar">
    <button
      mat-icon-button
      (click)="toggleMenu()"
      aria-label="Gezinme menüsünü aç veya kapat"
      [attr.aria-expanded]="
        appConfig.isMobile ? (matSideNav?.opened ?? false) : !isCollapsed
      "
      aria-controls="portal-navigation"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <a
      class="brand"
      routerLink="/dashboard"
      aria-label="Material Workspace ana sayfa"
    >
      <mat-icon>widgets</mat-icon>
      <span
        ><strong>Material Workspace</strong><small>Yönetim Portalı</small></span
      >
    </a>
    <span class="navbar-spacer"></span>
    <button
      mat-icon-button
      [matMenuTriggerFor]="paletteMenu"
      matTooltip="Renk paleti"
      aria-label="Renk paleti seç"
    >
      <mat-icon>palette</mat-icon>
    </button>
    <mat-menu #paletteMenu="matMenu" class="palette-menu">
      <div class="palette-menu-heading">
        Renk paleti<small>Çalışma alanını kişiselleştir</small>
      </div>
      @for (palette of theme.palettes; track palette.id) {
        <button
          mat-menu-item
          role="menuitemradio"
          [attr.aria-checked]="theme.palette() === palette.id"
          (click)="theme.selectPalette(palette.id)"
        >
          <span class="palette-option">
            <span class="palette-swatches" aria-hidden="true"
              ><i [style.background]="palette.surface"></i
              ><i [style.background]="palette.color"></i
              ><i [style.background]="palette.highlight"></i
            ></span>
            <span>{{ palette.name }}</span>
            @if (theme.palette() === palette.id) {
              <mat-icon class="palette-check">check</mat-icon>
            }
          </span>
        </button>
      }
    </mat-menu>
    <button
      mat-icon-button
      [matTooltip]="
        theme.mode() === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç'
      "
      [attr.aria-label]="
        theme.mode() === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç'
      "
      (click)="theme.toggle()"
    >
      <mat-icon>{{
        theme.mode() === 'dark' ? 'light_mode' : 'dark_mode'
      }}</mat-icon>
    </button>
    <button
      mat-button
      class="account-button"
      [matMenuTriggerFor]="accountMenu"
      aria-label="Hesap menüsü"
    >
      <mat-icon>account_circle</mat-icon
      ><span>{{ account.displayName() }}</span>
    </button>
    <mat-menu #accountMenu>
      <button mat-menu-item routerLink="/account">
        <mat-icon>person_outline</mat-icon><span>Profilim</span>
      </button>
      <button mat-menu-item (click)="logOut()">
        <mat-icon>logout</mat-icon><span>Çıkış yap</span>
      </button>
    </mat-menu>
  </mat-toolbar>
  <mat-sidenav-container class="workspace" autosize>
    <mat-sidenav
      id="portal-navigation"
      [class.expanded]="!isCollapsed"
      [mode]="appConfig.isMobile ? 'over' : 'side'"
      [opened]="!appConfig.isMobile"
      #sidenav
    >
      <mat-nav-list aria-label="Ana gezinme">
        @for (item of menuItems; track $index) {
          <app-menu-items
            [item]="item"
            [collapsed]="isCollapsed"
            [routeHistory]="''"
          ></app-menu-items>
        }
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <main id="main-content" tabindex="-1" class="page-content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
