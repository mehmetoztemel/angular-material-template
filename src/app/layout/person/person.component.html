<section class="table-page">
  <h1 class="table-page-title">Kişiler</h1>
  <div class="table-page-content">
    <mo-table
      [columns]="cols"
      [value]="data"
      [displayedColumns]="displayedColumns"
      [showPaginator]="true"
      [showSorted]="true"
      [isNewActive]="true"
      (onNewClick)="openDetailDialog(null)"
    />
  </div>
</section>
