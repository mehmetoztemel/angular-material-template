<form
  class="entry-form entry-form-body"
  [formGroup]="personDetailForm"
  (ngSubmit)="savePerson()"
>
  <div class="form-section-heading">
    <mat-icon>person_outline</mat-icon>
    <h3>Kişi bilgileri</h3>
  </div>
  <div class="form-grid">
    <mat-form-field appearance="outline"
      ><mat-label>Ad</mat-label
      ><input matInput formControlName="firstName" required /><mat-error
        >Ad zorunludur.</mat-error
      ></mat-form-field
    >
    <mat-form-field appearance="outline"
      ><mat-label>Soyad</mat-label
      ><input matInput formControlName="lastName" required /><mat-error
        >Soyad zorunludur.</mat-error
      ></mat-form-field
    >
    <mat-form-field appearance="outline"
      ><mat-label>Doğum tarihi</mat-label
      ><input
        matInput
        [matDatepicker]="picker"
        formControlName="birthDate"
      /><mat-datepicker-toggle matSuffix [for]="picker" /><mat-datepicker
        #picker
      /><mat-error>Geçerli bir tarih girin.</mat-error></mat-form-field
    >
    <mat-form-field appearance="outline"
      ><mat-label>Telefon</mat-label
      ><input matInput type="tel" formControlName="phone" required /><mat-error
        >Telefon zorunludur.</mat-error
      ></mat-form-field
    >
    <mat-form-field class="span-full" appearance="outline"
      ><mat-label>E-posta</mat-label
      ><input
        matInput
        type="email"
        formControlName="email"
        required
      /><mat-error>Geçerli bir e-posta adresi girin.</mat-error></mat-form-field
    >
  </div>
  <footer class="form-actions">
    <span class="form-action-hint">Değişiklikler bu oturumda tutulur.</span
    ><button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="personDetailForm.invalid"
    >
      <mat-icon>save</mat-icon>Kaydet
    </button>
  </footer>
</form>
